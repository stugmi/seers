name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.9.0)"
        required: true
        type: string

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install ".[mcp,dev]"

      - name: Test package
        run: python -m pytest

      - name: Check bundled data outside the checkout
        run: |
          python -c "import os, tempfile; os.chdir(tempfile.gettempdir()); from seers import data; assert data.items.search('abyssal whip')[0].id == '4151'"

      - name: Build distributions
        run: python -m build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/*
          generate_release_notes: true
