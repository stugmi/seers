name: Release

# Publishes a release whenever the version in pyproject.toml changes on main.
# Bumping `version` and pushing is the whole release process: the workflow tags the
# pushed commit as v<version>, tests it, builds it and attaches the distributions.
# It can also be started by hand (Actions > Release > Run workflow); it then releases the
# current version of the chosen branch, if that version has no tag yet.

on:
  push:
    branches: ["main"]
    paths: ["pyproject.toml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.tag.outputs.missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing tag
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null; then
            echo "v${{ steps.version.outputs.version }} already released; nothing to do."
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install ".[mcp,dev]"

      - name: Test package
        run: python -m pytest

      - name: Check bundled data outside the checkout
        run: |
          python -c "import os, tempfile; os.chdir(tempfile.gettempdir()); from seers import data; assert data.items.search('abyssal whip')[0].id == '4151'"

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
