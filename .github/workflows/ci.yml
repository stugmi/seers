name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python package
        run: python -m pip install ".[mcp,dev]" build

      - name: Test Python package
        run: python -m pytest

      - name: Build Python distributions
        run: python -m build

      - name: Check bundled data outside the checkout
        run: |
          python -c "import os, tempfile; os.chdir(tempfile.gettempdir()); from seers import data; assert data.items.search('abyssal whip')[0].id == '4151'"
