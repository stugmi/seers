[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "seers"
version = "0.9.0"
description = "Old School RuneScape Wiki, Grand Exchange, hiscores and game cache names for Python, with an optional MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "WTFPL"
license-files = ["LICENSE"]
authors = [{ name = "Smug" }]
dependencies = [
  "anyio>=4.5,<5",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "markdownify>=1.2,<2",
  "rich>=13.9,<16",
]
keywords = ["osrs", "old school runescape", "runescape", "wiki", "grand exchange", "hiscores", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Games/Entertainment :: Role-Playing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/stugmi/seers"
Source = "https://github.com/stugmi/seers"
Issues = "https://github.com/stugmi/seers/issues"

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "trio>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "trio>=0.27"]

[project.scripts]
seers-wiki = "seers.cli.wiki:main"
seers-update = "seers.cli.update:main"
seers-mcp = "seers.mcp.server:main"

[tool.hatch.build.targets.sdist]
only-include = ["src/seers", "tests", "examples"]
exclude = ["src/seers/data/*.zip"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["TRY004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
