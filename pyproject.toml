[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "seers"
dynamic = ["version"]
description = "Old School RuneScape Wiki, Grand Exchange, hiscores and game definitions for Python, with an optional MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "WTFPL"
license-files = ["LICENSE"]
authors = [{ name = "Smug" }]
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "markdownify>=1.2,<2",
  "rich>=13.9,<16",
]
keywords = ["osrs", "old school runescape", "runescape", "wiki", "grand exchange", "hiscores", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Games/Entertainment :: Role-Playing",
]

[project.urls]
Homepage = "https://github.com/stugmi/seers"
Source = "https://github.com/stugmi/seers"
Issues = "https://github.com/stugmi/seers/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8"]

[project.scripts]
seers-wiki = "seers.wiki.cli:main"
seers-data = "seers.data.fetch.cli:main"
seers-mcp = "seers.mcp:main"

[tool.hatch.version]
path = "seers/version.py"

[tool.hatch.build.targets.wheel]
packages = ["seers"]

[tool.hatch.build.targets.sdist]
include = ["seers", "tests", "examples", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
